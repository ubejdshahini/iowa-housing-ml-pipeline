[project]
name = "iowa-housing-fastapi"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]",
    "scikit-learn==1.8.0",
    "pandas",
    "joblib",
    "python-dotenv",
    # add your other actual deps here
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"